<svg xmlns="http://www.w3.org/2000/svg" width="940" height="850" viewBox="0 0 940 850" role="img" aria-labelledby="titel beschrijving">
  <title id="titel">Badkamer Akkerheer · indeling en maten</title>
  <desc id="beschrijving">De badkamer meet 2.150 bij 3.000 millimeter. Ingang rechts op de plattegrond. Bij binnenkomst staat rechts het badmeubel met dubbele wastafel en hoge kast aan de linkerzijde. De wc en inloopdouche zijn links, met een betegeld muurtje ertussen.</desc>
  <defs>
    <marker id="maatpijl" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 8 4.5 0 8" fill="none" stroke="#66594d" stroke-width="1.2"/>
    </marker>
    <style>
      .title{font:42px Georgia,serif;fill:#2a211c}
      .text{font:17px system-ui,sans-serif;fill:#49392e}
      .small{font:14px system-ui,sans-serif;fill:#66594d}
      .measure{font:600 18px system-ui,sans-serif;fill:#49392e}
      .line{fill:none;stroke:#877565;stroke-width:1.4}
      .dimension{marker-start:url(#maatpijl);marker-end:url(#maatpijl)}
      .wall{fill:none;stroke:#625346;stroke-width:17;stroke-linecap:square}
      .fixture{fill:#fffdf6;stroke:#8d7a68;stroke-width:1.6}
    </style>
  </defs>
  <rect width="940" height="850" fill="#f8f4ee"/>
  <text x="58" y="58" class="title">Badkamer</text>
  <text x="60" y="87" class="small">AKKERHEER · EERSTE VERDIEPING</text>
