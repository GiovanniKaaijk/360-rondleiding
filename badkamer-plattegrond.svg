  <rect x="164" y="408" width="32" height="90" fill="#f8f4ee"/>
  <text x="183" y="453" text-anchor="middle" class="measure" transform="rotate(-90 183 453)">3.000 mm</text>

  <!-- 170 SVG units represent 1 metre. Inside corners follow the Blender model. -->
  <rect x="245" y="198" width="365.5" height="510" fill="#e8dbc7"/>
  <path d="M428 198v510m-183-153h365m-365-204h365" fill="none" stroke="#c7b49b" stroke-width="1"/>
