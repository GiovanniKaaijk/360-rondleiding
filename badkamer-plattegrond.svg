  <rect x="286" y="220" width="81" height="52" rx="11" fill="#f1ece4" stroke="#978477"/>
  <rect x="409" y="220" width="81" height="52" rx="11" fill="#f1ece4" stroke="#978477"/>
  <path d="M326 210v15m123-15v15" stroke="#986d48" stroke-width="5" stroke-linecap="round"/>
